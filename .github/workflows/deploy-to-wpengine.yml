name: Deploy to WP Engine

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: GitHub Action Deploy to WP Engine
        uses: wpengine/github-action-wpe-site-deploy@v4
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: mongabaynewstg
          REMOTE_PATH: wp-content/themes/mongabay_v2/

      - name: Clear WP Engine Cache
        if: success()
        run: |
          curl -X POST https://api.wpengine.com/v1/sites/mongabaynewstg/cache \
            -H "Authorization: Bearer ${{ secrets.WPENGINE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"action":"purge_all"}'
          echo "WP Engine cache cleared successfully!"

